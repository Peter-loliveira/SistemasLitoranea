<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Contrato de Locação · RE/MAX Litorânea</title>
<style>
:root{--red:#DC1C2E;--blue:#003DA5;--ink:#1d2433;--mut:#5d6677;--line:#dde2ea;--bg:#f2f4f8}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:#fff;border-bottom:5px solid var(--red);box-shadow:0 2px 0 var(--blue)}
.hd{max-width:1000px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.hd img{height:46px}.hd h1{font-size:20px;margin:0;color:var(--blue)}.hd p{margin:2px 0 0;color:var(--mut);font-size:13px}
main{max-width:1000px;margin:20px auto 110px;padding:0 16px;counter-reset:s}
section,details{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:16px;padding:18px 20px}
.sec>summary{font-size:16px;color:var(--blue);display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;list-style:none;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::before{counter-increment:s;content:counter(s);background:var(--red);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.sec>summary::after{content:"▸";margin-left:auto;color:var(--red);font-size:18px;transition:transform .15s}
.sec[open]>summary::after{transform:rotate(90deg)}
.sec[open]>summary{margin-bottom:14px}
.party>summary{cursor:pointer;font-weight:700;color:var(--blue)}.party>summary .x{float:right}.party[open]>summary{margin-bottom:10px}
.conta{align-items:end;margin-bottom:8px}
.garant{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:12px 14px;background:#fafbfd}.garant>b{display:block;color:var(--blue);margin-bottom:8px}.garant .chk{font-weight:700;color:var(--blue)}.garant input:disabled{background:#eceff4;cursor:not-allowed}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}input[type=file]{display:none}
#imp{background:#fff;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:14px}#imp[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:#39435a}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);padding:9px 10px;border:1px solid #c5ccd8;border-radius:6px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.err{border-color:var(--red)!important;background:#fff4f5!important}
.chk{flex-direction:row;align-items:center;gap:8px;font-weight:500;padding-top:22px}.chk input{width:auto}
small{font-weight:400;color:var(--mut);font-size:12px;min-height:15px}
.end{background:#eef3fc;border:1px solid #c9d7f2;border-radius:6px;padding:9px 10px;color:var(--blue);font-weight:700;min-height:40px;display:flex;align-items:center}
details.party{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 14px;margin-bottom:12px;background:#fafbfd}
.btn{border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.red{background:var(--red);color:#fff}.red:hover{background:#b9111f}.line{background:#fff;color:var(--blue);border:2px solid var(--blue)}.line:hover{background:#eef3fc}
.x{background:none;border:0;color:var(--red);cursor:pointer;font:inherit;font-size:13px;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:4px solid var(--blue);padding:12px 16px;display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
#msg{font-size:14px;font-weight:600}#msg.bad{color:var(--red)}#msg.ok{color:#0a7a3d}
@media(max-width:720px){.f{grid-column:span 12!important}.chk{padding-top:0}}
</style></head><body>

function field(f,np){
 if(f.empty)return '<div class="s'+f.span+'"></div>';
 if(f.raw)return f.raw;
 const id=np?'':' id="f_'+f.id+'" ',k=' data-k="'+f.id+'" ';
 if(f.chk)return '<label class="f chk s'+f.span+'"><input type="checkbox"'+id+k+(f.def?'checked':'')+'> '+f.l+'</label>';
 let h;
 if(f.box)h='<div class="end" id="f_'+f.id+'">—</div>';
 else if(f.sel)h='<select'+id+k+'>'+f.sel.map(o=>{o=Array.isArray(o)?o:[o,o];return '<option value="'+o[0]+'"'+(o[0]==f.def?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select>';
 else h='<input'+id+k+'type="'+(f.type||'text')+'" value="'+(f.def??'')+'" placeholder="'+(f.ph||'')+'"'+(f.req?' data-req':'')+(f.mask?' data-mask':'')+(f.list?' list="dl_'+f.id+'"':'')+(f.type=='number'?' min="1" step="any"':'')+'>'+(f.list?'<datalist id="dl_'+f.id+'">'+f.list.map(o=>'<option value="'+o+'">').join('')+'</datalist>':'');
 return '<label class="f s'+f.span+'"><span>'+f.l+(f.req?' *':'')+'</span>'+h+(f.hint?'<small id="h_'+f.id+'"></small>':'')+'</label>';
}

 // contas de consumo
 const bc=grab(/todas as despesas de\s+(.+?),?\s*durante o per[ií]odo/i,P(/todas as despesas de/),'Contas de consumo');
 if(bc)splitTop(bc).forEach(x=>{const it=x.match(/^(.*?)\s*\(\s*(.*?)\s*(?:conta contrato|c[óo]digo do cliente|c[óo]digo|matr[íi]cula)\s*(?:n[ºo°.]*\s*)?([^\s)]+)\s*\)\s*$/i);let nome=it?(it[1]+(it[2]?' ('+it[2]+')':'')).trim():x;R.conts.push({nome:nome.charAt(0).toUpperCase()+nome.slice(1),num:it?it[3]:''})});

 F.honor=grab(/honor[áa]rios do advogado em\s+([\d.,]+)\s*%/i,P(/honor[áa]rios do advogado/),'Honorários');F.inad=grab(/atraso maior que\s+(\d+)/i,P(/atraso maior que/),'Prazo de inadimplência');

 const pr=P(/reajustado a cada/);F.reaj=grab(/a cada per[ií]odo de\s*(\d+)/i,pr,'Período de reajuste');F.indice=grab(/[íi]ndices\s+([A-Za-z-]+)\s*,/i,pr,'Índice de reajuste');
 F.m_resc=grab(/equivalente [àa]\s+(\d+)/i,P(/equivalente [àa]/),'Multa rescisória');
 const pc=P(/antes de completar/);F.carenc=grab(/completar\s+(\d+)/i,pc,'Carência da multa rescisória');F.a_resc=grab(/prazo m[ií]nimo de\s+(\d+)/i,pc,'Aviso prévio de rescisão');
 F.pref=grab(/prazo de\s+(\d+)/i,P(/responder a notifica[çc][ãa]o/),'Prazo de preferência');

 // testemunhas
 const t0=L.findIndex(l=>/^TESTEMUNHA/i.test(l));
 if(t0>=0){const z=L.slice(t0).join('\n').replace(/_{3,}/g,''),ns=[...z.matchAll(/NOME\s*:[ \t]*([^\n]*?)[ \t]*(?=CPF\s*:|\n|$)/gi)].map(m=>m[1].trim()),cs=[...z.matchAll(/CPF\s*:[ \t]*([^\n]*?)[ \t]*(?=NOME\s*:|TESTEMUNHA|\n|$)/gi)].map(m=>m[1].trim());
  Object.assign(F,{t1n:ns[0]||'',t1c:fmtCPF(cs[0]||''),t2n:ns[1]||'',t2c:fmtCPF(cs[1]||'')})}

function setSel(e,v){const k=semAc(v).toLowerCase();let o=[...e.options].find(o=>semAc(o.value).toLowerCase()==k||semAc(o.text).toLowerCase()==k);if(!o){o=new Option(v,v);e.add(o)}e.value=o.value}

 ['owner','tenant'].forEach(kind=>{const box=$('#'+kind+'s');box.innerHTML='';const arr=R[kind+'s'];(arr.length?arr:[{}]).forEach(p=>{addParty(kind);const c=box.lastElementChild;PARTY.forEach(f=>{const e=c.querySelector('[data-k='+f.id+']');let v=p[f.id];if(v==null)return;if(f.id=='cpf')v=fmtCPF(v);if(e.tagName=='SELECT')setSel(e,v);else e.value=v})})});
 $('#contas').innerHTML='';(R.conts.length?R.conts:[{nome:'',num:''}]).forEach(c=>{addConta();const el=$('#contas').lastElementChild;el.querySelector('[data-c=nome]').value=c.nome;el.querySelector('[data-c=num]').value=c.num});
 setGar(R.F.garantia||'caucao');
 for(const k in R.F){let v=R.F[k];const e=$('#f_'+k);if(!e||v===undefined||v===null)continue;

 caucaoManual=true;['aluguel','caucao'].forEach(k=>{const v=money(V(k));$('#h_'+k).textContent=v>0?moneyTxt(v):''});
 fim();$$('.err').forEach(e=>e.classList.remove('err'));$$('.sec').forEach(d=>d.open=true);
}
async function importar(file){
 try{
  msg('Lendo o contrato…');const{R,miss}=parseContrato(await docLines(file));
  if(!R.owners.length&&!R.tenants.length&&miss.length>12)throw new Error('este arquivo não parece um contrato de locação no formato do modelo');

  const b=$('#imp');b.hidden=false;
  b.innerHTML='<b>✔ Contrato importado:</b> '+esc(file.name)+' — '+R.owners.length+' locador(es), '+R.tenants.length+' locatário(s), '+R.conts.length+' conta(s) de consumo.<br>'+(miss.length?'<span style="color:var(--red)"><b>Não consegui identificar:</b> '+miss.map(esc).join('; ')+'.</span><br>':'')+'Revise todos os campos, corrija o que estava errado e clique em “Gerar contrato”. <button type="button" class="x" id="impX">fechar</button>';
  $('#impX').onclick=()=>b.hidden=true;window.scrollTo({top:0,behavior:'smooth'});
 }catch(err){console.error(err);msg('Não foi possível importar: '+err.message,'bad')}
}
