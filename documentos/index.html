<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gerador de Contrato de Locação · RE/MAX Litorânea</title>
    <style>
      :root {
        --red: #dc1c2e;
        --blue: #003da5;
        --ink: #1d2433;
        --mut: #5d6677;
        --line: #dde2ea;
        --bg: #f2f4f8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.45 system-ui,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        color: var(--ink);
        background: var(--bg);
      }
      header {
        background: #fff;
        border-bottom: 5px solid var(--red);
        box-shadow: 0 2px 0 var(--blue);
      }
      .hd {
        max-width: 1000px;
        margin: auto;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .hd img {
        height: 46px;
      }
      .hd h1 {
        font-size: 20px;
        margin: 0;
        color: var(--blue);
      }
      .hd p {
        margin: 2px 0 0;
        color: var(--mut);
        font-size: 13px;
      }
      main {
        max-width: 1000px;
        margin: 20px auto 110px;
        padding: 0 16px;
        counter-reset: s;
      }
      section,
      details {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 16px;
        padding: 18px 20px;
      }
      .sec > summary {
        font-size: 16px;
        color: var(--blue);
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        font-weight: 700;
        list-style: none;
        user-select: none;
      }
      .sec > summary::-webkit-details-marker {
        display: none;
      }
      .sec > summary::before {
        counter-increment: s;
        content: counter(s);
        background: var(--red);
        color: #fff;
        border-radius: 50%;
        width: 26px;
        height: 26px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        flex: none;
      }
      .sec > summary::after {
        content: "▸";
        margin-left: auto;
        color: var(--red);
        font-size: 18px;
        transition: transform 0.15s;
      }
      .sec[open] > summary::after {
        transform: rotate(90deg);
      }
      .sec[open] > summary {
        margin-bottom: 14px;
      }
      .party > summary {
        cursor: pointer;
        font-weight: 700;
        color: var(--blue);
      }
      .party > summary .x {
        float: right;
      }
      .party[open] > summary {
        margin-bottom: 10px;
      }
      .conta,
      .vbank {
        align-items: end;
        margin-bottom: 8px;
      }
      [hidden] {
        display: none !important;
      }
      .typebox {
        background: #fff;
        border: 1px solid var(--line);
        border-left: 5px solid var(--red);
        border-radius: 10px;
        padding: 16px 20px;
        margin-bottom: 16px;
      }
      .typebox select {
        font-size: 17px;
        font-weight: 700;
        color: var(--blue);
        padding: 12px;
      }
      textarea {
        resize: vertical;
      }
      .vbank {
        padding: 8px 0;
        border-top: 1px dashed var(--line);
      }
      .garant {
        border: 1px solid var(--line);
        border-left: 4px solid var(--red);
        border-radius: 8px;
        padding: 12px 14px;
        background: #fafbfd;
      }
      .garant > b {
        display: block;
        color: var(--blue);
        margin-bottom: 8px;
      }
      .garant .chk {
        font-weight: 700;
        color: var(--blue);
      }
      .garant input:disabled {
        background: #eceff4;
        cursor: not-allowed;
      }
      .tools {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      input[type="file"] {
        display: none;
      }
      #imp {
        background: #fff;
        border: 1px solid var(--line);
        border-left: 4px solid var(--red);
        border-radius: 8px;
        padding: 12px 16px;
        margin-bottom: 16px;
        font-size: 14px;
      }
      #imp[hidden] {
        display: none;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 12px;
      }
      .f {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        font-weight: 600;
        color: #39435a;
      }
      .s2 {
        grid-column: span 2;
      }
      .s3 {
        grid-column: span 3;
      }
      .s4 {
        grid-column: span 4;
      }
      .s5 {
        grid-column: span 5;
      }
      .s6 {
        grid-column: span 6;
      }
      .s8 {
        grid-column: span 8;
      }
      .s12 {
        grid-column: span 12;
      }
      input,
      select,
      textarea {
        font: inherit;
        font-weight: 400;
        color: var(--ink);
        padding: 9px 10px;
        border: 1px solid #c5ccd8;
        border-radius: 6px;
        background: #fff;
        width: 100%;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--blue);
        outline-offset: -1px;
        border-color: var(--blue);
      }
      .err {
        border-color: var(--red) !important;
        background: #fff4f5 !important;
      }
      .chk {
        flex-direction: row;
        align-items: center;
        gap: 8px;
        font-weight: 500;
        padding-top: 22px;
      }
      .chk input {
        width: auto;
      }
      small {
        font-weight: 400;
        color: var(--mut);
        font-size: 12px;
        min-height: 15px;
      }
      .end {
        background: #eef3fc;
        border: 1px solid #c9d7f2;
        border-radius: 6px;
        padding: 9px 10px;
        color: var(--blue);
        font-weight: 700;
        min-height: 40px;
        display: flex;
        align-items: center;
      }
      details.party {
        border: 1px solid var(--line);
        border-left: 4px solid var(--blue);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 12px;
        background: #fafbfd;
      }
      .btn {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .red {
        background: var(--red);
        color: #fff;
      }
      .red:hover {
        background: #b9111f;
      }
      .line {
        background: #fff;
        color: var(--blue);
        border: 2px solid var(--blue);
      }
      .line:hover {
        background: #eef3fc;
      }
      .x {
        background: none;
        border: 0;
        color: var(--red);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
      }
      .bar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: #fff;
        border-top: 4px solid var(--blue);
        padding: 12px 16px;
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
      }
      #msg {
        font-size: 14px;
        font-weight: 600;
      }
      #msg.bad {
        color: var(--red);
      }
      #msg.ok {
        color: #0a7a3d;
      }
      @media (max-width: 720px) {
        .f {
          grid-column: span 12 !important;
        }
        .chk {
          padding-top: 0;
        }
      }
    </style>
  </head>

    <main>
      <div class="typebox">
        <label class="f"
          ><span>Tipo de contrato</span
          ><select id="tipoContrato">
            <option value="">Selecione um tipo de contrato</option>
            <option value="aluguel">ALUGUEL</option>
            <option value="venda">VENDA</option>
          </select></label
        >
      </div>
      <div id="app_aluguel" hidden>
        <div class="tools">
          <button type="button" class="btn red" id="impBtn">
            📂 Importar contrato existente (.docx)</button
          ><input type="file" id="impFile" accept=".docx" /><button
            type="button"
            class="btn line"
            id="expAll"
          >
            Expandir tudo</button
          ><button type="button" class="btn line" id="colAll">
            Recolher tudo
          </button>
        </div>
        <div id="imp" hidden></div>
        <details class="sec">
          <summary>Locador(es) / Proprietário(s)</summary>
          <div id="owners"></div>
          <button type="button" class="btn line" id="addOwner">
            + Adicionar outro proprietário
          </button>
        </details>
        <details class="sec">
          <summary>Locatário(s) / Inquilino(s)</summary>
          <div id="tenants"></div>
          <button type="button" class="btn line" id="addTenant">
            + Adicionar outro inquilino
          </button>
        </details>
        <div id="dyn"></div>
      </div>
      <div id="app_venda" hidden></div>
    </main>
    <div class="bar" id="bar" hidden>
      <span id="msg"></span

          if(n>1)s=s.replace(/<w:pgMar [^>]*\/>/,'<w:pgMar w:top="960" w:right="850" w:bottom="1220" w:left="708" w:header="0" w:footer="989" w:gutter="0"/>');
          else s=s.replace('w:bottom="440"','w:bottom="1220"');
          return s;
        });
        // 2) Títulos de cláusula não ficam sozinhos no fim da página
        xml=xml.replace(/<w:p(?:\s[^>]*)?>(?:(?!<\/w:p>)[\s\S])*<\/w:p>/g,p=>{
          const t=p.replace(/<[^>]+>/g,'').trim();
          if(/^CLÁUSULA\s/.test(t)&&!/<w:keepNext/.test(p))return p.replace(/(<w:pStyle [^>]*\/>)/,'$1<w:keepNext/>');
          return p;
        });
        // 3) Barras vermelhas ancoradas na página: fixa na 1ª página, qualquer que seja o tamanho do texto
        const g7=xml.indexOf('name="Graphic 7"'),g8=xml.indexOf('name="Graphic 8"');
        if(g7>0&&g8>0){
          const rs=xml.lastIndexOf('<w:r>',g7),re=xml.indexOf('</w:r>',g8)+6;
          const run=xml.slice(rs,re);
          xml=xml.slice(0,rs)+xml.slice(re);
          const fp=xml.indexOf('</w:p>',xml.indexOf('<w:body>'));
          xml=xml.slice(0,fp)+run+xml.slice(fp);
        }
        // 4) Remove os parágrafos vazios de fonte grande (22 pt) que serviam só para empurrar o texto para a página 2
        xml=xml.replace(/<w:p(?:\s[^>]*)?>(?:(?!<\/w:p>)[\s\S])*<\/w:p>/g,p=>{

          return p;

        xml=xml.replace(/<w:br w:type="column"\/>/g,'');

        xml=xml.replace('<w:pPr><w:pStyle w:val="Corpodetexto"/><w:ind w:left="369"/></w:pPr><w:r><w:t>As</w:t></w:r>','<w:pPr><w:pStyle w:val="Corpodetexto"/><w:spacing w:before="360"/><w:ind w:left="369"/></w:pPr><w:r><w:t>As</w:t></w:r>');
        return xml;
      }

              if (f.id == "cpf") v = fmtCPF(v);

              else e.value = v;
            });
          });
        });

          const el = $("#contas").lastElementChild;
          el.querySelector("[data-c=nome]").value = c.nome;
          el.querySelector("[data-c=num]").value = c.num;
        });
        setGar(R.F.garantia || "caucao");
        for (const k in R.F) {
          let v = R.F[k];
          const e = $("#f_" + k);
          if (!e || v === undefined || v === null) continue;
          if (e.type == "checkbox") {
            e.checked = !!v;
            continue;
          }
          if (v === "" && !/^t[12][nc]$/.test(k)) continue;
          if (NUM.includes(k)) v = String(v).replace(",", ".");

          else e.value = v;
        }
        caucaoManual = true;
        ["aluguel", "caucao"].forEach((k) => {
          const v = money(V(k));
          $("#h_" + k).textContent = v > 0 ? moneyTxt(v) : "";
        });
        fim();
        $$(".err").forEach((e) => e.classList.remove("err"));
        $$("#app_aluguel .sec").forEach((d) => (d.open = true));

        try {
          msg("Lendo o contrato…");
          const { R, miss } = parseContrato(await docLines(file));
          if (!R.owners.length && !R.tenants.length && miss.length > 12)
            throw new Error(

          aplicar(R);
          msg("");
          const b = $("#imp");
          b.hidden = false;
          b.innerHTML =
            "<b>✔ Contrato importado:</b> " +

          window.scrollTo({ top: 0, behavior: "smooth" });

            dcq = cessao
              ? [
                  Vv("dc_nome"),
                  Vv("dc_nac") || "",
                  Vv("dc_prof") || "",
                  Vv("dc_ec") || "",
                ]
                  .filter(Boolean)
                  .join(", ") +
                (Vv("dc_rg")
                  ? ", portador(a) do RG nº " +
                    Vv("dc_rg") +
                    (Vv("dc_org") ? ", emitido pela " + Vv("dc_org") : "")
                  : "") +
                ", inscrito(a) no CPF sob nº " +
                Vv("dc_cpf") +
                ", residente e domiciliado(a) à " +
                Vv("dc_end") +
                ", falecido(a) no dia " +
                String(dd.d).padStart(2, "0") +
                "/" +
                String(dd.m + 1).padStart(2, "0") +
                "/" +
                dd.y
              : "";
          const nV = vend.length,
            pays = K.pays,
            mrp = N("multa_resc"),
            multaV = Math.round(K.preco * mrp) / 100;
          const posseM = {
            final: "mediante a liquidação final do preço",
            sinal: "no momento do pagamento do sinal/arras ou entrada",
            fin: "mediante a liquidação final do preço, após a aprovação e comprovação do depósito do financiamento",
          };
          const T = {
            preco: moneyTxt(K.preco),
            honor_val: moneyTxt(K.hv),
            multa_resc_val: moneyTxt(multaV),
            multa_resc_pct: pctP(mrp),
            honor_adv: pctP(N("honor_adv")),
            multa_atraso: pct(Vv("multa")),
            juros_dia: pctP(Vv("juros_dia")),
            multa_hon: pct(Vv("multa_hon")),
            juros_hon: pctP(Vv("juros_hon")),
            itens:
              pays.length == 1
                ? "item 3.A"
                : "itens " + lettersTxt(pays.length, "3."),
            itens_ab:
              pays.length == 1 ? "item A" : "itens " + lettersTxt(pays.length),
            item_hon: "item 3." + Vv("item_hon"),
            posse: posseM[Vv("posse")],
            ano: Vv("ano"),
            corr_nome: cc.nome.toUpperCase(),
            corr_rg: cc.rg,
            corr_cpf: cc.cpf,
            corr_creci: cc.creci,
            h_conta: Vv("h_conta"),
            h_ag: Vv("h_ag"),
            h_banco: Vv("h_banco").toUpperCase(),
            h_pixtipo: Vv("h_pixtipo"),
            h_pix: Vv("h_pix"),
            h_nominal: Vv("h_nom"),
            horas: n2w(N("horas")) + " horas",
            foro: Vv("foro"),
            vias: n2w(N("vias")),
            cidade_ass: Vv("local"),
            data_ass: LD(pd(Vv("data")), false),
            heirs_all:
              nV == 1
                ? "Devidamente"
                : nV == 2
                  ? "Ambos(as) devidamente"
                  : "Todos(as) devidamente",
            dc_qualif: dcq,
            matricula: Vv("matric"),
            cartorio: cartOk ? cart : "",
            honor_pct_txt: pct(Vv("hon_pct")),
          };
          const c = {
            cessao,
            R: ROLES[fam],
            nV,
            nC: comp.length,
            T,
            vend,
            comp,
            conj,
            pays,
            orig: K.o,
            dest: K.dest,
            corr: cc,
            imovelRows: rows,
            t: [Vv("t1n"), Vv("t1c"), Vv("t2n"), Vv("t2c")],
            flags: { conj: conj.length > 0 },
          };
          const zip = await JSZip.loadAsync(SHELL, { base64: true });
          let xml = await zip.file("word/document.xml").async("string");
          if (!xml.includes("@@BODY@@")) throw new Error("modelo inválido");
          const body = renderBody(fam, c);
          xml = xml.replace("@@BODY@@", () => body);
          zip.file("word/document.xml", xml);
          const blob = await zip.generateAsync({
            type: "blob",
            mimeType:
              "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
            compression: "DEFLATE",
          });
          const slug = comp[0].nome
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^A-Za-z0-9]+/g, "_")
            .replace(/^_|_$/g, "");
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download =
            (cessao ? "Contrato_Cessao_Venda_" : "Contrato_Venda_") +
            slug +
            "_" +
            Vv("data") +
            ".docx";
          document.body.append(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 4000);
          msg("Contrato de venda gerado!", "ok");
        } catch (err) {
          console.error(err);
          msg("Erro ao gerar: " + err.message, "bad");
        }
      }

      $("#tipoContrato").onchange = () => {
        const v = $("#tipoContrato").value;
        $("#app_aluguel").hidden = v != "aluguel";
        $("#app_venda").hidden = v != "venda";
        $("#bar").hidden = !v;
        msg("");
        $("#imp").hidden = true;
        if (v == "venda" && !$("#app_venda").children.length) buildVenda();
        window.scrollTo({ top: 0 });
      };
    </script>
  </body>
</html>
